name: test

# PRs only: a push to main runs build + test again inside publish.yml
# before releasing, so a second run here would be pure duplication.
on:
  pull_request:
    branches: [main]
  schedule:
    # Weekly drift check against zeph-to/plugin main — catches CORE_RULES /
    # gate-vector changes that land in the plugin repo between cli PRs.
    - cron: '0 3 * * 1'

# A new push to the same PR makes the older run moot.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # Type-check (tsc). Was a separate CI workflow building on Node 18/20/22;
      # tsc output does not depend on the Node version, so one run is enough.
      - run: npm run build

      - run: npm test

  plugin-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: zeph-to/plugin
          path: plugin

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check generated artifacts against plugin main
        run: node scripts/sync-from-plugin.mjs --check --plugin ./plugin
